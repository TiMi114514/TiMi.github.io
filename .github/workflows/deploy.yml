name: Deploy Paperwise to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://wksdpsmxwybsmtjjipxa.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_alewSOQDZmICsyaBfvNtBQ_FQE2KUg4' }}
          NEXT_PUBLIC_RAGFLOW_BASE_URL: ${{ vars.NEXT_PUBLIC_RAGFLOW_BASE_URL || 'http://localhost:9380' }}
          NEXT_PUBLIC_RAGFLOW_API_KEY: ${{ secrets.NEXT_PUBLIC_RAGFLOW_API_KEY || vars.NEXT_PUBLIC_RAGFLOW_API_KEY }}
          NEXT_PUBLIC_RAGFLOW_CHAT_ID: ${{ vars.NEXT_PUBLIC_RAGFLOW_CHAT_ID || 'f37a7a58e16c11f19cd2051ed6437597' }}
          NEXT_PUBLIC_RAGFLOW_DATASET_ID: ${{ vars.NEXT_PUBLIC_RAGFLOW_DATASET_ID || 'fc7e14a2de6a11f1a9754d2f35039beb,5757a2d2d65811f19d2c39315833de3b,2211959cd65811f19d2c39315833de3b,cf9abe9cd65711f19d2c39315833de3b,6edc5e5ed65611f19d2c39315833de3b,8c37aa54d65511f19d2c39315833de3b,ca2299a2d64e11f19d2c39315833de3b,11bc875cd53011f199ac25a3f02d59dc' }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '/TiMi.github.io' }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
